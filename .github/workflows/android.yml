name: Compilar APK de Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Bloquear pantalla en horizontal
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arcano-royale-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
